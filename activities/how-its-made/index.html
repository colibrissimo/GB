<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>How It's Made</title>
<!--
  How it's made: vocabulary for the SAB2 S3 product presentations (hand cream, sweets,
  ice cream, and cheese from Year 1). Built 21 Oct 2026 for TP 1 (23 Oct).
  One tab per product: word cards with stress and a speaker, the process in order,
  describing the result, then two solo drills. Drills show the student's own answer beside
  the right one (classroom-game-hardening 6b). The first option of each item is the right
  one; options are shuffled on screen.
  Audio: assets/audio/<key>.mp3 if present (key = the term, lowercase, non-alphanumerics
  to one hyphen), else the browser's British voice.
  Hand cream process and the sample data come from a lab manual chapter Sarah found
  ("Preparation of a hand cream", Experiment 39); the student answers in that report were
  not used.
-->
<style>
:root{
  --gt-cream:#faf6ef;--gt-ink:#2b2b2b;--gt-muted:#6d7078;--gt-teal:#2f7d4f;--gt-teal-d:#1f5c39;
  --gt-orange:#e08a3c;--gt-line:#e3dccd;--gt-line-s:#cdc4ad;--gt-card:#ffffff;
  --ok-bg:#ecf6f0;--ok-fg:#2e7d52;--no-bg:#fceceb;--no-fg:#b23b3b;
  --trap-bg:#fdf6e3;--trap-fg:#8a6408;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --gt-cream:#1a1b17;--gt-ink:#ece7db;--gt-muted:#a49d8a;--gt-teal:#5eb87e;--gt-teal-d:#8ad4a2;
    --gt-orange:#e8a361;--gt-line:#33392c;--gt-line-s:#454c39;--gt-card:#22261c;
    --ok-bg:#1c2a22;--ok-fg:#5fbe88;--no-bg:#301f1d;--no-fg:#e8746a;
    --trap-bg:#2e2a1c;--trap-fg:#dcb24f;
  }
}
:root[data-theme="dark"]{
  --gt-cream:#1a1b17;--gt-ink:#ece7db;--gt-muted:#a49d8a;--gt-teal:#5eb87e;--gt-teal-d:#8ad4a2;
  --gt-orange:#e8a361;--gt-line:#33392c;--gt-line-s:#454c39;--gt-card:#22261c;
  --ok-bg:#1c2a22;--ok-fg:#5fbe88;--no-bg:#301f1d;--no-fg:#e8746a;
  --trap-bg:#2e2a1c;--trap-fg:#dcb24f;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--gt-cream);color:var(--gt-ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  line-height:1.55;font-size:18px;padding:26px 16px 60px}
.wrap{max-width:980px;margin:0 auto}
h1{font-size:28px;margin:0 0 4px;color:var(--gt-teal-d);line-height:1.25}
.sub{color:var(--gt-muted);margin:0 0 18px;font-size:16px;max-width:68ch}
h2{font-size:22px;color:var(--gt-teal-d);margin:30px 0 4px}
h2 small{font-size:14px;color:var(--gt-muted);font-weight:400;margin-left:6px}
.lead{margin:0 0 12px;font-size:16.5px;color:var(--gt-muted);max-width:70ch}

.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 6px;padding:0;list-style:none}
.tab{font:inherit;font-size:16px;font-weight:700;padding:9px 16px;border-radius:999px;cursor:pointer;
  border:2px solid var(--gt-line-s);background:var(--gt-card);color:var(--gt-ink)}
.tab:hover{border-color:var(--gt-orange)}
.tab[aria-selected="true"]{background:var(--gt-teal);border-color:var(--gt-teal);color:#fff}
.tab:focus-visible,.btn:focus-visible,.say:focus-visible,.opt:focus-visible,.step:focus-visible{outline:3px solid var(--gt-orange);outline-offset:2px}
.tab .y1{font-weight:400;font-size:12.5px;opacity:.85;margin-left:4px}

.card{background:var(--gt-card);border:1px solid var(--gt-line-s);border-left:5px solid var(--gt-orange);
  border-radius:10px;padding:14px 16px;margin:12px 0}
.intro p{margin:0 0 8px}.intro p:last-child{margin:0}

.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px;margin:8px 0}
.w{background:var(--gt-card);border:1px solid var(--gt-line-s);border-radius:10px;padding:10px 12px;
  display:grid;grid-template-columns:1fr auto;gap:0 8px;align-items:start}
.w .t{font-weight:700;font-size:18px;line-height:1.3}
.w .st{font-size:14.5px;color:var(--gt-teal-d);letter-spacing:.4px;font-variant-numeric:tabular-nums}
.w .fr{font-size:14.5px;color:var(--gt-muted)}
.w .d{grid-column:1/-1;font-size:15.5px;margin-top:4px}
.w .trap{grid-column:1/-1;margin-top:6px;font-size:14.5px;background:var(--trap-bg);color:var(--gt-ink);
  border-left:4px solid var(--trap-fg);border-radius:6px;padding:5px 8px}
.w .trap b{color:var(--trap-fg)}
.say{font:inherit;border:2px solid var(--gt-line-s);background:var(--gt-cream);color:var(--gt-ink);
  border-radius:999px;width:38px;height:38px;cursor:pointer;display:grid;place-items:center;padding:0}
.say:hover{border-color:var(--gt-orange)}
.say svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.say.on{border-color:var(--gt-teal);color:var(--gt-teal)}

ol.proc{margin:8px 0;padding:0;list-style:none;counter-reset:s}
ol.proc li{counter-increment:s;background:var(--gt-card);border:1px solid var(--gt-line-s);border-radius:10px;
  padding:10px 12px 10px 52px;margin:0 0 8px;position:relative;font-size:16.5px}
ol.proc li:before{content:counter(s);position:absolute;left:12px;top:9px;width:28px;height:28px;border-radius:50%;
  background:var(--gt-teal);color:#fff;font-weight:700;display:grid;place-items:center;font-size:15px}
ol.proc .pv{display:block;font-size:14.5px;color:var(--gt-muted);margin-top:2px}
ol.proc .pv b{color:var(--gt-teal-d);font-weight:600}

.frames{margin:8px 0;padding:0;list-style:none}
.frames li{background:var(--gt-card);border:1px solid var(--gt-line-s);border-radius:10px;padding:9px 12px;margin:0 0 8px;font-size:16.5px}
.frames li .k{display:block;font-size:13px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--gt-muted)}
.frames em{font-style:normal;background:var(--trap-bg);padding:0 4px;border-radius:4px}

table.data{border-collapse:collapse;width:100%;font-size:15.5px;margin:8px 0;background:var(--gt-card)}
table.data th,table.data td{border:1px solid var(--gt-line-s);padding:6px 8px;text-align:left;vertical-align:top}
table.data th{background:var(--gt-cream);color:var(--gt-teal-d)}
.scroll{overflow-x:auto}

/* drills */
.drills{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.btn{font:inherit;font-size:16px;font-weight:700;padding:10px 18px;border-radius:10px;cursor:pointer;
  border:2px solid var(--gt-teal);background:var(--gt-teal);color:#fff}
.btn.ghost{background:var(--gt-card);color:var(--gt-teal-d)}
.btn:disabled{opacity:.45;cursor:default}
.drill{margin:10px 0}
.prog{display:flex;justify-content:space-between;color:var(--gt-muted);font-size:15px;margin-bottom:6px}
.q{font-size:19px;font-weight:600;margin:0 0 12px;line-height:1.4}
.opts{display:grid;gap:8px}
.opt{font:inherit;font-size:16.5px;text-align:left;background:var(--gt-cream);color:var(--gt-ink);
  border:2px solid var(--gt-line-s);border-radius:10px;padding:10px 12px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--gt-orange)}
.opt:disabled{cursor:default}
.opt.right{background:var(--ok-bg);border-color:var(--ok-fg)}
.opt.wrong{background:var(--no-bg);border-color:var(--no-fg)}
.opt .tag,.slot .tag{display:block;font-size:12.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase}
.right .tag{color:var(--ok-fg)}.wrong .tag{color:var(--no-fg)}
.why{margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--gt-cream);border:1px solid var(--gt-line);font-size:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

.pool{display:grid;gap:8px;margin:8px 0}
.step{font:inherit;font-size:16px;text-align:left;background:var(--gt-cream);color:var(--gt-ink);
  border:2px dashed var(--gt-line-s);border-radius:10px;padding:9px 12px;cursor:pointer}
.step:hover{border-color:var(--gt-orange);border-style:solid}
.mine{margin:8px 0;padding:0;list-style:none}
.slot{border:2px solid var(--gt-line-s);border-radius:10px;padding:8px 12px;margin:0 0 8px;background:var(--gt-card);font-size:16px}
.slot .n{font-weight:700;color:var(--gt-teal-d);margin-right:6px}
.slot.right{background:var(--ok-bg);border-color:var(--ok-fg)}
.slot.wrong{background:var(--no-bg);border-color:var(--no-fg)}
.slot .should{display:block;margin-top:4px;font-size:15px}
.slot .should b{color:var(--ok-fg)}
.lbl{font-size:13px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--gt-muted);margin:10px 0 2px}
.score{font-size:20px;font-weight:700;color:var(--gt-teal-d)}

.foot{font-size:12px;color:var(--gt-muted);margin-top:28px;text-align:center}
[hidden]{display:none!important}
@media (max-width:520px){body{font-size:17px}h1{font-size:24px}.q{font-size:18px}.tab{font-size:15px;padding:8px 12px}}
</style>
</head>

  <p class="foot">BUT2 SAB · S3 · Presentation vocabulary</p>

var TABS = [
 { id:"hand-cream", name:"Hand cream",
   intro:"<p>A hand cream is an <b>emulsion</b>: water and oils held together by an <b>emulsifier</b>. In the lab you heat two beakers, one with the water phase and one with the oil phase, then pour one into the other and stir.</p><p>In the recipe below the emulsifier is made in the beaker: <b>stearic acid</b> (an acid) and <b>triethanolamine</b> (a base) react and form a salt that is part water-loving, part oil-loving.</p>",

   quiz:[

     {q:"Which ingredient comes from sheep's wool?",o:["lanolin","stearic acid","propylene glycol","mineral oil"],e:"<b>Lanolin</b> is a wax from sheep's wool. It can absorb a quarter of its own weight in water."},
     {q:"Sample 4 was acidic (pH 5), lumpy and solid. What was left out?",o:["triethanolamine","mineral oil","propylene glycol","lanolin"],e:"<b>Triethanolamine</b> is the base. Without it, the stearic acid stays an acid (low pH) and no emulsifier forms, so the water and oils do not mix into a smooth cream."},

   ],
   process2:{title:"Coated chocolates: panning", steps:[

/* ---------- helpers ---------- */
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function key(t){return t.toLowerCase().replace(/'/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");}
function spoken(t){return t.replace(/\bpH\b/g,"P H").replace(/\//g,", ");}

var voice=null;
function pickVoice(){
  if(!("speechSynthesis" in window))return;
  var vs=speechSynthesis.getVoices();
  voice=vs.filter(function(v){return v.lang==="en-GB";})[0]||vs.filter(function(v){return /^en/.test(v.lang);})[0]||null;
}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function tts(t,btn){
  if(!("speechSynthesis" in window))return;
  speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(spoken(t));u.lang="en-GB";if(voice)u.voice=voice;u.rate=.85;
  u.onend=function(){btn.classList.remove("on");};
  speechSynthesis.speak(u);
}
function play(t,btn){
  btn.classList.add("on");
  var a=new Audio("assets/audio/"+key(t)+".mp3");
  a.onended=function(){btn.classList.remove("on");};
  a.play().catch(function(){tts(t,btn);});
}

function card(x){
  return '<div class="w"><div><div class="t">'+esc(x.t)+'</div>'+
    (x.s?'<div class="st">'+esc(x.s)+'</div>':'')+
    '<div class="fr">'+esc(x.f)+'</div></div>'+
    '<button class="say" type="button" data-say="'+esc(x.t)+'" aria-label="Hear: '+esc(x.t)+'">'+SPK+'</button>'+
    '<div class="d">'+esc(x.d)+'</div>'+
    (x.trap?'<div class="trap">'+x.trap+'</div>':'')+'</div>';
}
function words(list){return '<div class="words">'+list.map(card).join("")+'</div>';}
function proc(steps){return '<ol class="proc">'+steps.map(function(s){return '<li>'+esc(s[0])+'<span class="pv">'+s[1]+'</span></li>';}).join("")+'</ol>';}
function frames(list){return '<ul class="frames">'+list.map(function(f){return '<li><span class="k">'+esc(f[0])+'</span>'+f[1]+'</li>';}).join("")+'</ul>';}

/* ---------- render a tab ---------- */
var view=document.getElementById("view"), tabsEl=document.getElementById("tabs");
function render(id){
  var T=TABS.filter(function(t){return t.id===id;})[0]||TABS[0];
  [].forEach.call(tabsEl.children,function(b){b.setAttribute("aria-selected",b.dataset.id===T.id?"true":"false");});
  var h='<div class="card intro">'+T.intro+'</div>';
  if(T.sections){
    T.sections.forEach(function(s){h+='<h2>'+esc(s.h)+'</h2>'+(s.lead?'<p class="lead">'+esc(s.lead)+'</p>':'')+frames(s.frames);});
  } else {
    T.groups.forEach(function(g){h+='<h2>'+esc(g.h)+'</h2>'+words(g.words);});
    if(T.process)h+='<h2>How it\'s made <small>'+(T.process2?'jelly sweets':'step by step')+'</small></h2><p class="lead">The first line is what you do. The grey line is the same step in the passive, for your slides.</p>'+proc(T.process);
    if(T.process2)h+='<h2>How it\'s made <small>'+esc(T.process2.title.split(": ")[1])+'</small></h2>'+proc(T.process2.steps);
    if(T.describe.length)h+='<h2>Describe the result</h2>'+words(T.describe);
    if(T.extra)h+=T.extra;
    if(T.frames.length)h+='<h2>Say it in a sentence</h2>'+frames(T.frames);
  }
  h+='<h2>Check yourself</h2><p class="lead">On your own. You will see your answer beside the right one.</p><div class="drills">'+
     (T.process?'<button class="btn" type="button" data-drill="order">Put the steps in order</button>':'')+
     (T.process2?'<button class="btn" type="button" data-drill="order2">Order the panning steps</button>':'')+
     '<button class="btn" type="button" data-drill="quiz">Quick questions ('+T.quiz.length+')</button></div><div class="drill card" id="drill" hidden></div>';
  view.innerHTML=h;
  view.querySelectorAll("[data-drill]").forEach(function(b){b.onclick=function(){
    var d=b.dataset.drill;
    if(d==="quiz")quiz(T.quiz);else orderDrill(d==="order"?T.process:T.process2.steps);
  };});
}

view.addEventListener("click",function(e){var b=e.target.closest(".say");if(b)play(b.dataset.say,b);});

/* ---------- drill: order the steps ---------- */
function orderDrill(steps){
  var box=document.getElementById("drill");box.hidden=false;
  var pool=shuffle(steps.map(function(s,i){return i;}));
  while(steps.length>1&&pool.every(function(v,i){return v===i;}))pool=shuffle(pool);
  var mine=[];
  function draw(){
    var h='<p class="q">Click the steps in the right order.</p><div class="lbl">Your order</div><ol class="mine">'+
      (mine.length?mine.map(function(i,n){return '<li class="slot"><span class="n">'+(n+1)+'.</span>'+esc(steps[i][0])+'</li>';}).join(""):'<li class="slot" style="color:var(--gt-muted)">Nothing yet.</li>')+'</ol>';
    var left=pool.filter(function(i){return mine.indexOf(i)<0;});
    if(left.length)h+='<div class="lbl">Steps left</div><div class="pool">'+left.map(function(i){return '<button class="step" type="button" data-i="'+i+'">'+esc(steps[i][0])+'</button>';}).join("")+'</div>';
    h+='<div class="row"><button class="btn ghost" type="button" id="undo"'+(mine.length?'':' disabled')+'>Undo</button>'+
       '<button class="btn" type="button" id="check"'+(left.length?' disabled':'')+'>Check</button></div>';
    box.innerHTML=h;
    box.querySelectorAll(".step").forEach(function(b){b.onclick=function(){mine.push(+b.dataset.i);draw();};});
    box.querySelector("#undo").onclick=function(){mine.pop();draw();};
    box.querySelector("#check").onclick=check;
  }
  function check(){
    var ok=0;
    var h='<div class="lbl">Your order</div><ol class="mine">'+mine.map(function(i,n){
      var good=i===n;if(good)ok++;
      return '<li class="slot '+(good?'right':'wrong')+'"><span class="tag">'+(good?'Right':'Your step '+(n+1))+'</span><span class="n">'+(n+1)+'.</span>'+esc(steps[i][0])+
        (good?'':'<span class="should"><b>Step '+(n+1)+' is:</b> '+esc(steps[n][0])+'</span>')+'</li>';
    }).join("")+'</ol><p class="score">'+ok+' / '+steps.length+' in the right place</p>'+
    '<div class="row"><button class="btn" type="button" id="again">Try again</button></div>';
    box.innerHTML=h;
    box.querySelector("#again").onclick=function(){orderDrill(steps);};
  }
  draw();box.scrollIntoView({behavior:"smooth",block:"nearest"});
}

/* ---------- drill: quick questions ---------- */
function quiz(items){
  var box=document.getElementById("drill");box.hidden=false;
  var order=shuffle(items),k=0,score=0,log=[];
  function show(){
    var it=order[k],opts=shuffle(it.o);
    box.innerHTML='<div class="prog"><span>Question '+(k+1)+' of '+order.length+'</span><span>Score '+score+'</span></div>'+
      '<p class="q">'+esc(it.q)+'</p><div class="opts">'+opts.map(function(o){return '<button class="opt" type="button">'+esc(o)+'</button>';}).join("")+'</div>'+
      '<div class="why" hidden></div><div class="row"><button class="btn" type="button" id="next" hidden>'+(k+1<order.length?'Next':'See my score')+'</button></div>';
    var bs=box.querySelectorAll(".opt");
    bs.forEach(function(b,i){b.onclick=function(){
      var pick=opts[i],right=it.o[0],good=pick===right;
      if(good)score++;log.push({q:it.q,pick:pick,right:right});
      bs.forEach(function(x,j){x.disabled=true;
        if(opts[j]===right){x.classList.add("right");x.insertAdjacentHTML("afterbegin",'<span class="tag">'+(good?'Your answer · right':'Right answer')+'</span>');}
        else if(j===i){x.classList.add("wrong");x.insertAdjacentHTML("afterbegin",'<span class="tag">Your answer</span>');}
      });
      var why=box.querySelector(".why");why.innerHTML=it.e;why.hidden=false;
      var nx=box.querySelector("#next");nx.hidden=false;nx.focus();
      nx.onclick=function(){k++;if(k<order.length)show();else end();};
    };});
  }
  function end(){
    box.innerHTML='<p class="score">'+score+' / '+order.length+'</p><ul class="frames">'+log.map(function(l){
      return '<li><span class="k">'+esc(l.q)+'</span>'+(l.pick===l.right?'<span style="color:var(--ok-fg)">'+esc(l.right)+'</span>':
        '<span style="color:var(--no-fg);text-decoration:line-through">'+esc(l.pick)+'</span><br><span style="color:var(--ok-fg)">'+esc(l.right)+'</span>')+'</li>';
    }).join("")+'</ul><div class="row"><button class="btn" type="button" id="again">Again</button></div>';
    box.querySelector("#again").onclick=function(){quiz(items);};
  }
  show();box.scrollIntoView({behavior:"smooth",block:"nearest"});
}

/* ---------- tabs ---------- */
TABS.forEach(function(t){
  var b=document.createElement("button");b.className="tab";b.type="button";b.setAttribute("role","tab");b.dataset.id=t.id;
  b.innerHTML=esc(t.name)+(t.y1?'<span class="y1">Year 1</span>':'');
  b.onclick=function(){history.replaceState(null,"","#"+t.id);render(t.id);};
  tabsEl.appendChild(b);
});
/* The shared words go first in every product tab's flow, under their own tab. */
TABS.splice(0,0,{id:"science",name:"The science",intro:"<p>These words work for all three products. A cream and an ice cream are both <b>emulsions</b>, and every product has a <b>texture</b>, a <b>pH</b> and a <b>shelf life</b>.</p>",
  sections:null,groups:[{h:"Shared words",words:SHARED}],process:null,describe:[],frames:[],quiz:[
   {q:"What does an emulsifier do?",o:["It holds oil and water together.","It makes the product sweeter.","It kills bacteria.","It freezes the water."],e:"One end of an <b>emulsifier</b> loves water, the other loves oil."},
   {q:"A preservative is…",o:["un conservateur","un préservatif","un colorant","un émulsifiant"],e:"<b>Preservative</b> = un conservateur. Un préservatif is a condom."},
   {q:"How do you say pH?",o:["pee AITCH","pé ache","fuh","pee ash"],e:"The English letters: <b>P, H</b> (pee aitch)."},
   {q:"Your cream has oil on top and water underneath. It has…",o:["separated","emulsified","stabilised","dissolved"],e:"A failed emulsion <b>separates</b>."}
  ]});
var sb=document.createElement("button");sb.className="tab";sb.type="button";sb.setAttribute("role","tab");sb.dataset.id="science";sb.textContent="The science";
sb.onclick=function(){history.replaceState(null,"","#science");render("science");};
tabsEl.insertBefore(sb,tabsEl.firstChild);

var start=(location.hash||"").slice(1);
render(TABS.some(function(t){return t.id===start;})?start:"science");
})();
</script>
