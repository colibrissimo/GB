<div id="fi-match">
  <style>
    #fi-match{--petrol:#13525C;--petrol2:#1c6b78;--saffron:#F4B942;--saffron2:#e0a52a;--ink:#10262b;--paper:#f6f4ee;--line:#cfd8d8;--ok:#2e7d52;--no:#b23b3b;font-family:Arial, sans-serif;color:var(--ink);background:var(--paper);max-width:820px;margin:0 auto;padding:18px;border-radius:14px;line-height:1.55;}
    #fi-match *{box-sizing:border-box;}
    #fi-match h1{font-size:30px;margin:0 0 2px;color:var(--petrol);}
    #fi-match .sub{margin:0 0 16px;color:#3a4a4d;font-size:15px;}
    #fi-match .cols{display:flex;gap:14px;align-items:flex-start;}
    #fi-match .col{flex:1;min-width:0;}
    #fi-match .card{background:#fff;border:2px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;font-size:16px;transition:border-color .15s, background .15s;}
    #fi-match .col.l .card{font-weight:bold;color:var(--petrol);font-size:18px;}
    #fi-match .card:hover{border-color:var(--saffron);}
    #fi-match .card.sel{border-color:var(--petrol);background:#f2f7f8;}
    #fi-match .card.ok{border-color:var(--ok);background:#eaf5ee;cursor:default;opacity:.8;}
    #fi-match .card.no{border-color:var(--no);background:#fbecec;}
    #fi-match .score{text-align:center;color:#52646a;font-size:15px;margin-top:10px;}
    #fi-match .btns{display:flex;justify-content:center;margin-top:8px;}
    #fi-match button{font-family:inherit;font-size:15px;font-weight:bold;border:none;border-radius:10px;padding:11px 16px;cursor:pointer;background:#eef1f0;color:var(--petrol);}
    @media (max-width:560px){ #fi-match .cols{flex-direction:column;} }
  </style>
  <h1>Food idioms &middot; Match</h1>
  <p class="sub">Tap an idiom, then tap its definition. A wrong pair turns red and comes back. Say each idiom out loud as you match it.</p>
  <div class="cols"><div class="col l" id="fi-l"></div><div class="col r" id="fi-r"></div></div>
  <div class="score" id="fi-msc"></div>
  <div class="btns"><button id="fi-reset">Start again</button></div>
  <script>
  (function(){
    var P=[
      ["to go bananas","to become very angry or excited"],
      ["couch potato","a person who spends a lot of time sitting and watching television instead of being active"],
      ["a piece of cake","something that is very easy to do"],
      ["bad apple","someone whose behaviour negatively influences the others in a group"],
      ["to go pear-shaped","for a situation to suddenly become messy or unsuccessful"],
      ["like peas in a pod","two people who are very similar or very close"],
      ["cherry on top","an extra detail that makes something even better"],
      ["the apple never falls far from the tree","children often resemble their parents in character or behaviour"]
    ];
    var L=document.getElementById('fi-l'), Rr=document.getElementById('fi-r'), SC=document.getElementById('fi-msc'), RS=document.getElementById('fi-reset');
    if(!L||!Rr) return;
    var sel=null, done=0, tries=0;
    function sh(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;} return a; }
    function build(){
      sel=null; done=0; tries=0; SC.textContent='';
      var idx=[]; for(var i=0;i<P.length;i++) idx.push(i);
      var li=sh(idx), ri=sh(idx), h='';
      for(i=0;i<li.length;i++) h+='<div class="card" data-k="'+li[i]+'">'+P[li[i]][0]+'</div>'; L.innerHTML=h; h='';
      for(i=0;i<ri.length;i++) h+='<div class="card" data-k="'+ri[i]+'">'+P[ri[i]][1]+'</div>'; Rr.innerHTML=h;
    }
    function pick(e,side){
      var c=e.target.closest?e.target.closest('.card'):null; if(!c||c.classList.contains('ok')) return;
      if(sel&&sel.side===side){ sel.el.classList.remove('sel'); sel={el:c,side:side}; c.classList.add('sel'); return; }
      if(!sel){ sel={el:c,side:side}; c.classList.add('sel'); return; }
      tries++;
      var a=sel.el, b=c; sel=null; a.classList.remove('sel');
      if(a.getAttribute('data-k')===b.getAttribute('data-k')){
        a.classList.add('ok'); b.classList.add('ok'); done++;
        SC.textContent=done+' of '+P.length+' matched'+(done===P.length?' in '+tries+' tries. Finished.':'');
      } else {
        a.classList.add('no'); b.classList.add('no');
        setTimeout(function(){ a.classList.remove('no'); b.classList.remove('no'); },600);
      }
    }
    L.addEventListener('click',function(e){pick(e,'l');});
    Rr.addEventListener('click',function(e){pick(e,'r');});
    if(RS) RS.addEventListener('click',build);
    build();
  })();
  </script>
</div>
