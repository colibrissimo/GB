<!doctype html>
<meta charset="utf-8">
<title>Schwa audio check</title>
<style>
 body{font-family:Arial,sans-serif;background:#f6f4ee;color:#10262b;max-width:820px;margin:0 auto;padding:22px;line-height:1.55}
 h1{color:#13525C;font-size:26px;margin:0 0 4px}
 p.sub{color:#3a4a4d;margin:0 0 16px}
 button{font:inherit;font-weight:bold;border:none;border-radius:10px;padding:11px 18px;cursor:pointer;background:#F4B942;color:#10262b}
 button:hover{background:#e0a52a}
 #sum{margin:16px 0;padding:12px 15px;border-radius:10px;border:2px solid #cfd8d8;background:#fff;font-size:17px;font-weight:bold}
 table{width:100%;border-collapse:collapse;margin-top:14px;font-size:15px}
 td,th{border:1px solid #cfd8d8;padding:6px 9px;text-align:left}
 th{background:#eef1f0;color:#13525C}
 tr.ok td.st{color:#2e7d52;font-weight:bold}
 tr.no td.st{color:#b23b3b;font-weight:bold}
 tr.wait td.st{color:#8a8578}
 td.k{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
 .play{cursor:pointer;text-decoration:underline;color:#13525C}
</style>
<h1>Schwa audio check</h1>
<p class="sub">Open this file on your own machine and press the button. It loads every clip the module asks for, exactly the way the module asks for it, and tells you which ones answer. Click any green row to hear it.</p>
<button id="go">Check all 63 clips</button>
<div id="sum">Not run yet.</div>
<table><thead><tr><th>Status</th><th>Key</th><th>Where</th><th>Text</th></tr></thead><tbody id="rows"></tbody></table>
<script>
var BASES={GB:"https://colibrissimo.github.io/GB/pronunciation/schwa/assets/audio/",
           geii:"https://colibrissimo.github.io/geii/pronunciation/schwa/assets/audio/"};
var ITEMS=[{"k": "beer", "t": "beer", "b": "GB"}, {"k": "brewer", "t": "brewer", "b": "GB"}, {"k": "water", "t": "water", "b": "GB"}, {"k": "barley", "t": "barley", "b": "GB"}, {"k": "lager", "t": "lager", "b": "GB"}, {"k": "cellar", "t": "cellar", "b": "GB"}, {"k": "porter", "t": "porter", "b": "GB"}, {"k": "cooper", "t": "cooper", "b": "GB"}, {"k": "filtered", "t": "filtered", "b": "GB"}, {"k": "beverage", "t": "beverage", "b": "GB"}, {"k": "consumer", "t": "consumer", "b": "GB"}, {"k": "flavour", "t": "flavour", "b": "GB"}, {"k": "factory", "t": "factory", "b": "GB"}, {"k": "grocery", "t": "grocery", "b": "GB"}, {"k": "container", "t": "container", "b": "GB"}, {"k": "preservative", "t": "preservative", "b": "GB"}, {"k": "colour", "t": "colour", "b": "GB"}, {"k": "sugar", "t": "sugar", "b": "GB"}, {"k": "butter", "t": "butter", "b": "GB"}, {"k": "consume", "t": "consume", "b": "GB"}, {"k": "survival", "t": "survival", "b": "GB"}, {"k": "organism", "t": "organism", "b": "GB"}, {"k": "evidence", "t": "evidence", "b": "GB"}, {"k": "vessel", "t": "vessel", "b": "GB"}, {"k": "alien", "t": "alien", "b": "GB"}, {"k": "drunkenness", "t": "drunkenness", "b": "GB"}, {"k": "stumble-across", "t": "stumble across", "b": "GB"}, {"k": "material", "t": "material", "b": "GB"}, {"k": "caramelise", "t": "caramelise", "b": "GB"}, {"k": "microbiology", "t": "microbiology", "b": "GB"}, {"k": "efficient", "t": "efficient", "b": "GB"}, {"k": "decompose", "t": "decompose", "b": "GB"}, {"k": "chemistry", "t": "chemistry", "b": "GB"}, {"k": "innovate", "t": "innovate", "b": "GB"}, {"k": "sustainability", "t": "sustainability", "b": "GB"}, {"k": "the-brewer-filtered-the-water-into-a-larger-vessel", "t": "The brewer filtered the water into a larger vessel.", "b": "GB"}, {"k": "a-tiny-organism-turns-sugar-into-a-beverage", "t": "A tiny organism turns sugar into a beverage.", "b": "GB"}, {"k": "the-consumer-wants-better-flavour-and-longer-shelf-life", "t": "The consumer wants better flavour and longer shelf life.", "b": "GB"}, {"k": "the-factory-stores-the-raw-material-in-a-cold-container", "t": "The factory stores the raw material in a cold container.", "b": "GB"}, {"k": "again", "t": "again", "b": "geii"}, {"k": "amazing", "t": "amazing", "b": "geii"}, {"k": "analysis", "t": "analysis", "b": "geii"}, {"k": "august", "t": "august", "b": "geii"}, {"k": "bottom", "t": "bottom", "b": "geii"}, {"k": "canada", "t": "canada", "b": "geii"}, {"k": "carrot", "t": "carrot", "b": "geii"}, {"k": "circus", "t": "circus", "b": "geii"}, {"k": "confirm", "t": "confirm", "b": "geii"}, {"k": "difficult", "t": "difficult", "b": "geii"}, {"k": "duplicate", "t": "duplicate", "b": "geii"}, {"k": "family", "t": "family", "b": "geii"}, {"k": "father", "t": "father", "b": "geii"}, {"k": "madness", "t": "madness", "b": "geii"}, {"k": "measure", "t": "measure", "b": "geii"}, {"k": "pennsylvania", "t": "pennsylvania", "b": "geii"}, {"k": "president", "t": "president", "b": "geii"}, {"k": "problem", "t": "problem", "b": "geii"}, {"k": "pyjamas", "t": "pyjamas", "b": "geii"}, {"k": "soda", "t": "soda", "b": "geii"}, {"k": "summer", "t": "summer", "b": "geii"}, {"k": "support", "t": "support", "b": "geii"}, {"k": "system", "t": "system", "b": "geii"}, {"k": "tomorrow", "t": "tomorrow", "b": "geii"}];
var tb=document.getElementById('rows'), sum=document.getElementById('sum');
ITEMS.forEach(function(it,i){
  var tr=document.createElement('tr'); tr.className='wait'; tr.id='r'+i;
  tr.innerHTML='<td class="st">waiting</td><td class="k">'+it.k+'.mp3</td><td>'+it.b+'</td><td>'+it.t+'</td>';
  tb.appendChild(tr);
});
document.getElementById('go').addEventListener('click',function(){
  var done=0, ok=0, bad=[];
  sum.textContent='Checking...';
  ITEMS.forEach(function(it,i){
    var url=BASES[it.b]+encodeURIComponent(it.k)+'.mp3';
    var a=new Audio(); a.preload='metadata';
    function mark(good){
      if(a.__d) return; a.__d=1; done++;
      var tr=document.getElementById('r'+i);
      tr.className=good?'ok':'no';
      tr.firstChild.textContent=good?'found':'MISSING';
      if(good){ ok++; tr.querySelector('.k').innerHTML='<span class="play">'+it.k+'.mp3</span>';
        tr.querySelector('.play').addEventListener('click',function(){ new Audio(url).play(); }); }
      else bad.push(it.k);
      if(done===ITEMS.length){
        sum.textContent = ok+' of '+ITEMS.length+' found.' + (bad.length? '  Missing: '+bad.join(', ') : '  Everything is there.');
        sum.style.borderColor = bad.length ? '#b23b3b' : '#2e7d52';
      }
    }
    a.onloadedmetadata=function(){mark(true)};
    a.oncanplay=function(){mark(true)};
    a.onerror=function(){mark(false)};
    setTimeout(function(){mark(false)},15000);
    a.src=url;
  });
});
</script>
